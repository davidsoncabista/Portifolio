name: Check Self-hosted Runner

on:
  workflow_dispatch:  # Permite executar manualmente

jobs:
  diagnose:
    name: Diagnóstico do Runner
    runs-on: [self-hosted, linux, deploy]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar ambiente do runner
        run: |
          echo "=== Informações do Sistema ==="
          echo "Usuário atual: $(whoami)"
          echo "Diretório atual: $(pwd)"
          echo "Node.js version: $(node -v || echo 'Node.js não instalado')"
          echo "NPM version: $(npm -v || echo 'NPM não instalado')"
          
          echo -e "\n=== Permissões do Projeto ==="
          ls -la /var/www/portfolio-app || echo "Diretório do projeto não encontrado"
          
          echo -e "\n=== Status do PM2 ==="
          pm2 list || echo "PM2 não instalado"
          
          echo -e "\n=== Variáveis de Ambiente ==="
          env | grep -E "GITHUB_|RUNNER_|PATH|NODE_|HOME"
          
          echo -e "\n=== Teste de Acesso ==="
          if [ -w "/var/www/portfolio-app" ]; then
            echo "✅ Runner tem permissão de escrita no diretório do projeto"
          else
            echo "❌ Runner NÃO tem permissão de escrita no diretório do projeto"
          fi