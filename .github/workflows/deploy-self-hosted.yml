name: Deploy (self-hosted)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: NEXT_TELEMETRY_DISABLED=1 npm run build

      - name: Deploy (local)
        run: |
          set -e
          echo "🚀 Deploy iniciando: $(date)"

          # Assegure que estamos na pasta do projeto
          cd /var/www/portfolio-app

          # Garantir que o código está sincronizado com a branch
          git fetch origin main
          git reset --hard origin/main

          # Instalar dependências (produção)
          npm ci --production

          # Rodar build 
          NEXT_TELEMETRY_DISABLED=1 npm run build

          # Instalar PM2 se necessário
          if ! command -v pm2 &> /dev/null; then
            echo "Instalando pm2..."
            sudo npm install -g pm2
          fi

          # Reiniciar / iniciar a app
          if pm2 list | grep -q "PortfolioFrontend"; then
            pm2 reload PortfolioFrontend || pm2 restart PortfolioFrontend
          else
            pm2 start npm --name "PortfolioFrontend" -- start
          fi

          # Healthcheck local
          echo "🏥 Executando healthcheck..."
          for i in {1..6}; do
            if curl -s http://localhost:9002/ > /dev/null; then
              echo "✅ Aplicação está respondendo"
              exit 0
            fi
            echo "⏳ Aguardando app iniciar ($i/6)"
            sleep 10
          done

          echo "❌ Healthcheck falhou"
          exit 1
