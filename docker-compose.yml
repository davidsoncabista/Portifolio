services:
  portfolio-frontend:
    build: .
    container_name: portfolio-frontend
    ports:
      - '3000:3000'
    restart: always

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Belem
      - PASSWORD=D-38lalelu)*
    volumes:
      - /var/www/portfolio:/config/workspace
    ports:
      - '8443:8443'
    restart: unless-stopped
